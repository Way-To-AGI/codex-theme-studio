<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Theme Studio · Theme Library</title>
  <style>
    :root{color-scheme:dark;--bg:#070a10;--panel:#111722;--ink:#f5f7fb;--muted:#94a0b4;--line:#ffffff17;--accent:#72e6ff;--danger:#ff9f9f;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 80% 0,#17364a 0,transparent 34%),radial-gradient(circle at 0 70%,#23183c 0,transparent 28%),var(--bg)}button{font:inherit}
    .shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:44px 0 64px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.16em}.top h1{font-size:clamp(30px,4vw,52px);line-height:1;margin:10px 0 12px;letter-spacing:-.045em}.top p{max-width:640px;margin:0;color:var(--muted);line-height:1.65}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button,.link{border:1px solid var(--line);border-radius:12px;background:#ffffff0a;color:var(--ink);padding:10px 13px;cursor:pointer;text-decoration:none;transition:.18s ease}button:hover,.link:hover{border-color:#72e6ff66;background:#72e6ff12}.primary{background:var(--accent);border-color:var(--accent);color:#061018;font-weight:750}.danger{color:var(--danger)}
    .status{display:flex;align-items:center;gap:10px;min-height:46px;margin-bottom:18px;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:#0d121bbb;backdrop-filter:blur(18px);color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#5eea9d;box-shadow:0 0 16px #5eea9d}.status[data-busy="true"] .dot{background:#ffd36a;box-shadow:0 0 16px #ffd36a}.status[data-error="true"] .dot{background:#ff7272;box-shadow:0 0 16px #ff7272}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{position:relative;overflow:hidden;min-height:310px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 18px 50px #0005}.card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 18px 60px #0007}.art{height:170px;background:linear-gradient(135deg,var(--c1,#26384b),var(--c2,#101722));background-size:cover;background-position:center}.veil{position:absolute;inset:0 0 auto;height:171px;background:linear-gradient(180deg,transparent 35%,var(--panel) 100%);pointer-events:none}.body{position:relative;padding:16px}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px}.mode{padding:4px 8px;border:1px solid var(--line);border-radius:999px}.body h2{font-size:19px;margin:12px 0 5px}.id{color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.card-actions{display:flex;gap:8px;margin-top:18px}.card-actions button{flex:1}.active-label{color:var(--accent);font-weight:700}.empty{padding:54px;border:1px dashed var(--line);border-radius:20px;text-align:center;color:var(--muted)}
    @media(max-width:720px){.shell{padding-top:26px}.top{display:block}.actions{justify-content:flex-start;margin-top:20px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">CODEX THEME STUDIO</div><h1 data-i18n="title">主题库</h1><p data-i18n="subtitle">浏览所有已安装主题，热切换、恢复原生外观，或进入工作台创作自己的主题。</p></div>
      <div class="actions"><button id="language">EN</button><button id="native" data-i18n="native">原生外观</button><button id="studio" class="primary" data-i18n="create">创作新主题</button><button id="shutdown" class="danger" data-i18n="shutdown">彻底恢复并退出</button></div>
    </header>
    <div id="status" class="status"><span class="dot"></span><span data-i18n="loading">正在连接主题服务…</span></div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script>
    const token=new URL(location.href).hash.slice(1);let lang=localStorage.getItem('cts-language')||'zh';let state=null;
    const copy={zh:{title:'主题库',subtitle:'浏览所有已安装主题，热切换、恢复原生外观，或进入工作台创作自己的主题。',native:'原生外观',create:'创作新主题',shutdown:'彻底恢复并退出',loading:'正在连接主题服务…',ready:'主题服务已连接',nativeState:'当前使用原生外观',apply:'应用主题',active:'正在使用',light:'浅色',dark:'深色',switching:'正在安全切换主题…',restoring:'正在恢复原生外观…',stopped:'已彻底恢复，主题服务已退出。',empty:'没有发现可用主题。',error:'操作失败：'},en:{title:'Theme library',subtitle:'Browse installed themes, switch live, restore native appearance, or create a new theme.',native:'Native appearance',create:'Create theme',shutdown:'Restore & quit',loading:'Connecting to the theme service…',ready:'Theme service connected',nativeState:'Native appearance is active',apply:'Apply theme',active:'Active',light:'Light',dark:'Dark',switching:'Switching theme safely…',restoring:'Restoring native appearance…',stopped:'Native appearance restored and the theme service stopped.',empty:'No valid themes found.',error:'Operation failed: '}};
    const t=k=>copy[lang][k]||k;const status=document.querySelector('#status');
    function translate(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));document.querySelector('#language').textContent=lang==='zh'?'EN':'中文';if(state)render(state)}
    function setStatus(message,kind='ok'){status.dataset.busy=kind==='busy';status.dataset.error=kind==='error';status.lastElementChild.textContent=message}
    async function api(route,body){const response=await fetch(`/api/${route}`,{method:body?'POST':'GET',headers:{'x-cts-token':token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
    async function art(id,node){try{const response=await fetch(`/api/art/${encodeURIComponent(id)}`,{headers:{'x-cts-token':token}});if(!response.ok)return;const blob=await response.blob();node.style.backgroundImage=`url("${URL.createObjectURL(blob)}")`}catch{}}
    function render(data){state=data;const grid=document.querySelector('#grid');grid.replaceChildren();setStatus(data.activeTheme?`${t('ready')} · ${data.activeTheme}`:t('nativeState'));if(!data.themes.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('empty');grid.append(empty);return}for(const item of data.themes){const card=document.createElement('article');card.className='card'+(item.id===data.activeTheme?' active':'');const artNode=document.createElement('div');artNode.className='art';const palette=item.palette||{};artNode.style.setProperty('--c1',palette.accent||'#26384b');artNode.style.setProperty('--c2',palette.surface||'#101722');card.append(artNode);const veil=document.createElement('div');veil.className='veil';card.append(veil);const body=document.createElement('div');body.className='body';const meta=document.createElement('div');meta.className='meta';const version=document.createElement('span');version.textContent=`v${item.version}`;const mode=document.createElement('span');mode.className='mode';mode.textContent=t(item.designedFor==='dark'?'dark':'light');meta.append(version,mode);const h=document.createElement('h2');h.textContent=item.displayName;const id=document.createElement('div');id.className='id';id.textContent=item.id;const actions=document.createElement('div');actions.className='card-actions';const button=document.createElement('button');button.className=item.id===data.activeTheme?'active-label':'primary';button.disabled=item.id===data.activeTheme;button.textContent=t(item.id===data.activeTheme?'active':'apply');button.onclick=async()=>{setStatus(t('switching'),'busy');try{render(await api('switch',{theme:item.id}))}catch(error){setStatus(t('error')+error.message,'error')}};actions.append(button);body.append(meta,h,id,actions);card.append(body);grid.append(card);if(item.hasArt)art(item.id,artNode)}}
    async function refresh(){try{render(await api('themes'))}catch(error){setStatus(t('error')+error.message,'error')}}
    document.querySelector('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('cts-language',lang);translate()};
    document.querySelector('#native').onclick=async()=>{setStatus(t('restoring'),'busy');try{render(await api('native',{}))}catch(error){setStatus(t('error')+error.message,'error')}};
    document.querySelector('#studio').onclick=async()=>{try{await api('studio',{});setStatus(t('ready'))}catch(error){setStatus(t('error')+error.message,'error')}};
    document.querySelector('#shutdown').onclick=async()=>{if(!confirm(t('shutdown')+'?'))return;setStatus(t('restoring'),'busy');try{await api('shutdown',{});setStatus(t('stopped'));document.querySelectorAll('button').forEach(n=>n.disabled=true)}catch(error){setStatus(t('error')+error.message,'error')}};
    translate();refresh();
  </script>
</body>
</html>
