<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Codex Theme Studio · Theme Library</title>
  <link rel="stylesheet" href="/assets/studio-shell.css">
  <style>
    :root{color-scheme:dark;--bg:#070a10;--panel:#111722;--panel-strong:#151d2a;--ink:#f5f7fb;--muted:#94a0b4;--line:#ffffff17;--accent:#72e6ff;--danger:#ff9f9f;font-family:var(--cts-font)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 82% -8%,#17364a 0,transparent 34%),radial-gradient(circle at -4% 76%,#23183c 0,transparent 29%),var(--bg)}button{font:inherit}
    .shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0 68px}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:28px;margin-bottom:24px}.eyebrow{color:var(--accent);font-size:11px;font-weight:780;letter-spacing:.18em}.top h1{font-size:clamp(32px,4vw,48px);line-height:1;margin:10px 0 12px;letter-spacing:-.045em}.top p{max-width:620px;margin:0;color:var(--muted);font-size:14px;line-height:1.65}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button,.link{min-height:40px;border:1px solid var(--line);border-radius:11px;background:#ffffff09;color:var(--ink);padding:9px 13px;cursor:pointer;text-decoration:none;transition:border-color .16s ease,background .16s ease,opacity .16s ease}button:hover,.link:hover{border-color:#72e6ff66;background:#72e6ff10}button:disabled{cursor:not-allowed;opacity:.42}.primary{background:var(--accent);border-color:var(--accent);color:#061018;font-weight:760}.danger{color:var(--danger)}.quiet{color:var(--muted)}
    .service-wrap{margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:18px}.card{position:relative;overflow:hidden;min-height:326px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 18px 52px #0004;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-2px);border-color:#ffffff28;box-shadow:0 24px 62px #0006}.card.active{border-color:#72e6ff9e;box-shadow:0 0 0 1px #72e6ff52,0 22px 62px #0006}.active-chip{position:absolute;z-index:2;top:12px;left:12px;padding:5px 9px;border:1px solid #72e6ff55;border-radius:999px;color:#baf3ff;background:#07111bde;font-size:10px;font-weight:760;backdrop-filter:blur(12px)}.art{height:174px;background:linear-gradient(135deg,var(--c1,#26384b),var(--c2,#101722));background-size:cover;background-position:center}.veil{position:absolute;inset:0 0 auto;height:175px;background:linear-gradient(180deg,transparent 38%,var(--panel) 100%);pointer-events:none}.body{position:relative;padding:17px}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px}.mode{padding:4px 8px;border:1px solid var(--line);border-radius:999px}.body h2{min-height:46px;margin:12px 0 5px;font-size:19px;line-height:1.22;letter-spacing:-.02em}.id{color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace}.card-actions{display:flex;gap:8px;margin-top:18px}.card-actions button{flex:1}.active-label{color:var(--accent);font-weight:700}.empty{grid-column:1/-1;padding:54px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}
    @media(max-width:720px){.shell{padding-top:26px}.top{display:block}.actions{justify-content:flex-start;margin-top:20px}.grid{grid-template-columns:1fr}.body h2{min-height:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><div class="eyebrow">CODEX THEME STUDIO</div><h1 data-i18n="title">主题库</h1><p data-i18n="subtitle">浏览已安装主题，热切换、恢复原生外观，或进入工作台创作自己的主题。</p></div>
      <div class="actions"><button id="language">EN</button><button id="native" data-requires-runtime data-i18n="native">原生外观</button><button id="studio" class="primary" data-i18n="create">定制新主题</button><button id="shutdown" class="danger" data-i18n="shutdown">彻底恢复并退出</button></div>
    </header>
    <section class="service-wrap">
      <div id="service" class="cts-service-panel" data-state="busy">
        <div class="cts-service-summary"><span class="cts-service-dot"></span><div><div id="serviceTitle" class="cts-service-title" data-i18n="loading">正在连接主题服务…</div><div id="serviceDetail" class="cts-service-detail" data-i18n="loadingDetail">正在检查管理器和 Codex 运行时。</div><div id="command" class="cts-command"></div></div></div>
        <div class="cts-service-actions"><button id="retry" class="quiet" data-i18n="retry">重新连接</button><button id="showCommand" class="quiet" data-i18n="showCommand">查看 CLI 命令</button><button id="copyCommand" class="quiet" data-i18n="copyCommand">复制启动命令</button></div>
      </div>
    </section>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>
  <script>
    const token=new URL(location.href).hash.slice(1);let lang=localStorage.getItem('cts-language')||'zh';let state=null;let serviceState='busy';
    const copy={zh:{title:'主题库',subtitle:'浏览已安装主题，热切换、恢复原生外观，或进入工作台创作自己的主题。',native:'原生外观',create:'定制新主题',shutdown:'彻底恢复并退出',loading:'正在连接主题服务…',loadingDetail:'正在检查管理器和 Codex 运行时。',ready:'主题服务已连接',readyDetail:'页面与命令行共享同一运行状态，可以安全热切换。',nativeState:'当前使用原生外观',apply:'应用主题',active:'正在使用',light:'浅色',dark:'深色',switching:'正在安全切换主题…',restoring:'正在恢复原生外观…',stopped:'主题服务已退出',stoppedDetail:'原生外观已恢复。再次使用时请运行启动命令。',empty:'没有发现可用主题。',retry:'重新连接',showCommand:'查看 CLI 命令',hideCommand:'收起 CLI 命令',copyCommand:'复制启动命令',copied:'启动命令已复制',offline:'主题服务尚未启动',offlineDetail:'页面无法连接本地管理器。请运行桌面入口或 CLI 启动主题库。',unattached:'Codex 尚未接管',unattachedDetail:'管理器已启动，但当前没有可用的 Codex 页面。可能需要明确授权后重启接管。',stale:'运行会话已失效',staleDetail:'旧的 Codex 调试会话已经关闭。请重新接管后再切换主题。',restart:'需要重新接管 Codex',restartDetail:'为保护当前任务，页面不会自行重启 Codex。请在确认后使用 CLI 重新接管。',operationFailed:'操作未完成',operationDetail:'主题未改变，请检查状态后重试。'},en:{title:'Theme library',subtitle:'Browse installed themes, switch live, restore native appearance, or customize a new theme.',native:'Native appearance',create:'Customize theme',shutdown:'Restore & quit',loading:'Connecting to theme service…',loadingDetail:'Checking the manager and Codex runtime.',ready:'Theme service connected',readyDetail:'The page and CLI share one runtime state and can switch safely.',nativeState:'Native appearance is active',apply:'Apply theme',active:'Active',light:'Light',dark:'Dark',switching:'Switching theme safely…',restoring:'Restoring native appearance…',stopped:'Theme service stopped',stoppedDetail:'Native appearance is restored. Run the start command when needed.',empty:'No valid themes found.',retry:'Reconnect',showCommand:'Show CLI command',hideCommand:'Hide CLI command',copyCommand:'Copy start command',copied:'Start command copied',offline:'Theme service is not running',offlineDetail:'The local manager is unreachable. Use the desktop launcher or CLI to open the library.',unattached:'Codex is not attached',unattachedDetail:'The manager is running, but no eligible Codex page is connected. Explicit restart authorization may be required.',stale:'Runtime session is stale',staleDetail:'The previous Codex debugging session has closed. Reattach before switching themes.',restart:'Codex reattachment required',restartDetail:'The page never restarts Codex by itself. Confirm first, then reattach through the CLI.',operationFailed:'Operation did not complete',operationDetail:'The theme was not changed. Check the status and retry.'}};
    const t=key=>copy[lang][key]||key;const service=document.querySelector('#service');const command=document.querySelector('#command');
    const startCommand='node scripts/theme.mjs web';const reconnectCommand='node scripts/theme.mjs use <theme-id> --restart-existing';
    function translate(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));document.querySelector('#language').textContent=lang==='zh'?'EN':'中文';renderService(serviceState);if(state)render(state)}
    function setInteractive(enabled){document.querySelectorAll('[data-requires-runtime],.card-actions button').forEach(node=>node.disabled=!enabled||node.dataset.active==='true')}
    function renderService(kind,detail){serviceState=kind;service.dataset.state=kind;const titles={busy:'loading',ready:'ready',offline:'offline',unattached:'unattached',stale:'stale',restart:'restart',stopped:'stopped',error:'operationFailed'};const details={busy:'loadingDetail',ready:'readyDetail',offline:'offlineDetail',unattached:'unattachedDetail',stale:'staleDetail',restart:'restartDetail',stopped:'stoppedDetail',error:'operationDetail'};document.querySelector('#serviceTitle').textContent=t(titles[kind]||'operationFailed');document.querySelector('#serviceDetail').textContent=detail||t(details[kind]||'operationDetail');command.textContent=['restart','stale','unattached'].includes(kind)?reconnectCommand:startCommand;setInteractive(kind==='ready')}
    function classify(error){const message=String(error?.message||error);if(/Failed to fetch|fetch failed|NetworkError|ECONNREFUSED/i.test(message))return['offline'];if(/CDP session|session is closed|session closed/i.test(message))return['stale'];if(/restart|already running without Theme Studio CDP|no eligible|zero renderers/i.test(message))return['restart'];return['error',message]}
    async function api(route,body){const response=await fetch(`/api/${route}`,{method:body===undefined?'GET':'POST',headers:{'x-cts-token':token,...(body===undefined?{}:{'content-type':'application/json'})},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(5000)});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data}
    async function art(id,node){try{const response=await fetch(`/api/art/${encodeURIComponent(id)}`,{headers:{'x-cts-token':token},signal:AbortSignal.timeout(5000)});if(!response.ok)return;const blob=await response.blob();node.style.backgroundImage=`url("${URL.createObjectURL(blob)}")`}catch{}}
    function render(data){state=data;const grid=document.querySelector('#grid');grid.replaceChildren();if(!data.themes.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('empty');grid.append(empty);return}for(const item of data.themes){const active=item.id===data.activeTheme;const card=document.createElement('article');card.className='card'+(active?' active':'');if(active){const chip=document.createElement('span');chip.className='active-chip';chip.textContent=t('active');card.append(chip)}const artNode=document.createElement('div');artNode.className='art';const palette=item.palette||{};artNode.style.setProperty('--c1',palette.accent||'#26384b');artNode.style.setProperty('--c2',palette.surface||'#101722');card.append(artNode);const veil=document.createElement('div');veil.className='veil';card.append(veil);const body=document.createElement('div');body.className='body';const meta=document.createElement('div');meta.className='meta';const version=document.createElement('span');version.textContent=`v${item.version}`;const mode=document.createElement('span');mode.className='mode';mode.textContent=t(item.designedFor==='dark'?'dark':'light');meta.append(version,mode);const heading=document.createElement('h2');heading.textContent=item.displayName;const id=document.createElement('div');id.className='id';id.textContent=item.id;const actions=document.createElement('div');actions.className='card-actions';const button=document.createElement('button');button.className=active?'active-label':'primary';button.dataset.active=String(active);button.disabled=active||serviceState!=='ready';button.textContent=t(active?'active':'apply');button.onclick=()=>switchTheme(item.id);actions.append(button);body.append(meta,heading,id,actions);card.append(body);grid.append(card);if(item.hasArt)art(item.id,artNode)}}
    async function refresh(){renderService('busy');try{const data=await api('themes');render(data);renderService(data.runtimeReady===false?'unattached':'ready',data.activeTheme?`${t('readyDetail')} · ${data.activeTheme}`:t('nativeState'))}catch(error){renderService(...classify(error))}}
    async function switchTheme(theme){renderService('busy',t('switching'));try{const data=await api('switch',{theme});render(data);renderService('ready',`${t('readyDetail')} · ${data.activeTheme}`)}catch(error){renderService(...classify(error))}}
    document.querySelector('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('cts-language',lang);translate()};
    document.querySelector('#retry').onclick=refresh;
    document.querySelector('#showCommand').onclick=()=>{command.classList.toggle('visible');document.querySelector('#showCommand').textContent=t(command.classList.contains('visible')?'hideCommand':'showCommand')};
    document.querySelector('#copyCommand').onclick=async()=>{await navigator.clipboard.writeText(command.textContent||startCommand);document.querySelector('#copyCommand').textContent=t('copied');setTimeout(()=>document.querySelector('#copyCommand').textContent=t('copyCommand'),1600)};
    document.querySelector('#native').onclick=async()=>{renderService('busy',t('restoring'));try{const data=await api('native',{});render(data);renderService('ready',t('nativeState'))}catch(error){renderService(...classify(error))}};
    document.querySelector('#studio').onclick=async()=>{try{await api('studio',{});renderService('ready')}catch(error){renderService(...classify(error))}};
    document.querySelector('#shutdown').onclick=async()=>{if(!confirm(t('shutdown')+'?'))return;renderService('busy',t('restoring'));try{await api('shutdown',{});renderService('stopped');document.querySelectorAll('button').forEach(node=>node.disabled=true)}catch(error){renderService(...classify(error))}};
    translate();refresh();
  </script>
</body>
</html>
