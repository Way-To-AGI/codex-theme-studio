name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/self-test.mjs
      - run: node scripts/studio-protocol-test.mjs
      - run: node scripts/theme-control-test.mjs
      - run: node scripts/platform-runtime-test.mjs
